
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COVID Dashboard Tests</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/jasmine.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/jasmine.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/jasmine-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/boot0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/boot1.min.js"></script>
</head>

<body>

    <iframe id="dashboardFrame"
        src="index.html"
        style="display:none">
    </iframe>

    <script>
        // Wait until the dashboard has loaded.
        const frame = document.getElementById("dashboardFrame");

        frame.onload = function () {
            frame.contentWindow.__DASHBOARD_TEST_MODE__ = true;
        };
    </script>

</body>
</html>
